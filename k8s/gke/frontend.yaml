apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecg-platform-frontend
  namespace: ecg-clinical-research
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ecg-platform-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecg-platform-frontend
        app.kubernetes.io/part-of: ecg-health-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: frontend-image-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ecg-platform-frontend
  namespace: ecg-clinical-research
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ecg-platform-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
