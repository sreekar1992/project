apiVersion: v1
kind: ConfigMap
metadata:
  name: ecg-workbench-config
data:
  ECG_PROJECT_ROOT: /data
  # The web container is inference-only. Training, robustness, and full-dataset
  # encryption are run as explicitly submitted Jobs, not HTTP requests.
  ECG_ENABLE_BACKGROUND_JOBS: "false"
  ECG_ENABLE_TRAINING: "false"
  ECG_REQUIRE_MODEL_FOR_READY: "true"
  # Add your TLS Ingress hostname here before exposing this beyond port-forward.
  ECG_TRUSTED_HOSTS: localhost,127.0.0.1,[::1],ecg-workbench,ecg-workbench.ecg-research,ecg-workbench.ecg-research.svc,ecg-workbench.ecg-research.svc.cluster.local
  MPLBACKEND: Agg
  MPLCONFIGDIR: /tmp/matplotlib
