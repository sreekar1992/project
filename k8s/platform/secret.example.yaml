# Copy this file outside Git, replace every placeholder, and create the Secret
# in your deployment environment. Do not apply or commit populated credentials.
apiVersion: v1
kind: Secret
metadata:
  name: ecg-platform-secrets
  namespace: ecg-clinical-research
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/REPLACE_DATABASE
  SECRET_KEY: REPLACE_WITH_RANDOM_APPLICATION_SECRET
  JWT_SECRET: REPLACE_WITH_DIFFERENT_RANDOM_JWT_SECRET
  OBJECT_STORAGE_ACCESS_KEY: REPLACE_WITH_OBJECT_STORAGE_ACCESS_KEY
  OBJECT_STORAGE_SECRET_KEY: REPLACE_WITH_OBJECT_STORAGE_SECRET_KEY
