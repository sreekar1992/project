[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-cvd-xai"
version = "0.1.0"
description = "Research baseline for ECG arrhythmia classification on Mendeley 7dybx7wyfn"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "torch>=2.2",
  "matplotlib>=3.8", "requests>=2.31", "tqdm>=4.66", "cryptography>=43.0", "flask>=3.1,<4",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pydantic>=2.10,<3", "PyJWT>=2.10,<3",
  "boto3>=1.35,<2", "redis>=5.2,<7", "rq>=2.1,<3", "reportlab>=4.2,<5",
  "flask-limiter>=3.10,<5", "gunicorn>=23,<24", "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
export = ["onnx>=1.16,<2", "onnxscript>=0.2,<1"]

[project.scripts]
ecg-train = "ecg_cvd.train:main"
ecg-predict = "ecg_cvd.predict:main"
ecg-encrypt = "ecg_cvd.crypto:encrypt_main"
ecg-decrypt = "ecg_cvd.crypto:decrypt_main"
ecg-robustness = "ecg_cvd.robustness:main"
ecg-export-model = "ecg_cvd.export_model:main"
ecg-gui = "ecg_cvd.gui:main"
ecg-health-api = "ecg_cvd.clinical.app:main"
ecg-health-seed = "ecg_cvd.clinical.seed:main"
ecg-health-worker = "ecg_cvd.clinical.worker:main"
ecg-health-migrate = "ecg_cvd.clinical.migrate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecg_cvd = ["web/*.html"]
