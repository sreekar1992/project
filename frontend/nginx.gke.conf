server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://ecg-platform-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host ecg-platform-api;
        # The browser talks to this frontend at the same origin and this
        # reverse proxy is the API trust boundary. Do not forward a transient
        # browser Origin (for example Cloud Shell Web Preview) to the private
        # API, where it would be treated as an unintended direct CORS client.
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
